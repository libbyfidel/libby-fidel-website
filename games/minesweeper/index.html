<!DOCTYPE html><html lang="en"><head><link rel="stylesheet" href="/assets/site.css"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minesweeper · Libby Fidel</title><link rel="icon" href="/brand/libby-mark-teal.svg">
<style>body{margin:0;background:#FBF7F0;color:#13292C;font-family:-apple-system,sans-serif}h1{font-family:Georgia,serif;font-weight:400;margin:0 0 4px}h1 b{color:#FF5B14}p{color:#5C6664;margin:0 0 16px}#g{display:inline-grid;grid-template-columns:repeat(9,36px);gap:3px;background:#006D77;padding:10px;border-radius:14px}#g button{width:36px;height:36px;border:0;border-radius:6px;background:#83C5BE;font:700 16px sans-serif;color:#13292C;cursor:pointer}#g button.o{background:#F1EBE1;cursor:default}#g button.m{background:#FF5B14}#s{margin-top:14px;display:flex;gap:12px;align-items:center}#s button{background:#FF5B14;border:0;border-radius:99px;padding:9px 18px;font-weight:600;cursor:pointer}a{color:#006D77}</style></head>
<body><div class="band"><div class="wrap sh"><a class="logo" href="/"><img src="/brand/libby-mark-cream.svg" alt="">Libby Fidel</a><nav class="nav" aria-label="Main"><a href="/writing/">Writing</a><a href="/games/" class=on>Games</a><a href="/#about">About</a><a href="/#contact">Contact</a></nav></div></div><div style="display:grid;place-items:center;padding:40px 16px"><h1>Minesweeper<b>.</b></h1><p>Click to dig, right-click (or long-press) to flag. 10 mines.</p><div id="g"></div><div id="s"><button onclick="init()">New game</button><span id="t"></span></div><p style="margin-top:16px"><a href="/games/">← Games</a></p></div>
<script>
const N=9,M=10,C=['','#006D77','#3B6D11','#A32D2D','#3C3489','#854F0B','#0F6E56','#13292C','#5C6664'],g=document.getElementById('g'),t=document.getElementById('t');let b,started,over,left;
const nb=i=>{let r=[],x=i%N,y=i/N|0;for(let dy=-1;dy<2;dy++)for(let dx=-1;dx<2;dx++){let X=x+dx,Y=y+dy;if((dx||dy)&&X>=0&&Y>=0&&X<N&&Y<N)r.push(Y*N+X)}return r};
function init(){g.innerHTML='';b=[];started=over=false;left=N*N-M;t.textContent='';for(let i=0;i<N*N;i++){let e=document.createElement('button');e.onclick=()=>dig(i);e.oncontextmenu=ev=>{ev.preventDefault();flag(i)};let h;e.ontouchstart=()=>h=setTimeout(()=>{flag(i);h=0},400);e.ontouchend=ev=>{if(h===0)ev.preventDefault();clearTimeout(h)};g.append(e);b.push({e,m:0,o:0,f:0})}}
function lay(s){let safe=[s,...nb(s)],k=0;while(k<M){let i=Math.random()*N*N|0;if(!b[i].m&&!safe.includes(i)){b[i].m=1;k++}}}
function flag(i){let c=b[i];if(over||c.o)return;c.f^=1;c.e.textContent=c.f?'⚑':''}
function dig(i){let c=b[i];if(over||c.o||c.f)return;if(!started){lay(i);started=true}if(c.m){over=true;b.forEach(d=>{if(d.m){d.e.className='m';d.e.textContent='✱'}});t.textContent='Boom. Try again.';return}let q=[i];while(q.length){let j=q.pop(),d=b[j];if(d.o||d.f)continue;d.o=1;left--;let n=nb(j).filter(k=>b[k].m).length;d.e.className='o';d.e.textContent=n||'';d.e.style.color=C[n];if(!n)q.push(...nb(j))}if(!left){over=true;t.textContent='You cleared it! 🎉'}}
init();
</script></body></html>
