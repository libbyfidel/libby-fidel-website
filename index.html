<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Libby Fidel</title>
  <meta name="description" content="Libby Fidel — personal website.">
  <style>
    :root {
      --bg: #faf8f5;
      --text: #1f1d1a;
      --muted: #6b665e;
      --accent: #b4532a;
      --line: #e6e1d8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main {
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      padding: 18vh 24px 64px;
      flex: 1;
    }
    h1 {
      font-size: clamp(2.4rem, 6vw, 3.4rem);
      font-weight: normal;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 16px;
    }
    .tagline {
      font-size: 1.25rem;
      color: var(--muted);
      margin-bottom: 40px;
    }
    p { margin-bottom: 20px; font-size: 1.1rem; }
    .links {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 0.95rem;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer {
      text-align: center;
      padding: 24px;
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Libby Fidel</h1>
    <p class="tagline">Your one-line description goes here.</p>

    <p>A short paragraph about who you are and what you do. Replace this text with your own.</p>
    <p>A second paragraph about what you're working on now, or what people should reach out about.</p>

    <ul class="links">
      <li><a href="https://www.linkedin.com/" target="_blank" rel="noopener">LinkedIn</a></li>
      <li><a href="https://x.com/" target="_blank" rel="noopener">X / Twitter</a></li>
      <li><a href="mailto:you@example.com">Email</a></li>
    </ul>
  </main>
  <footer>&copy; 2026 Libby Fidel</footer>
</body>
</html>
